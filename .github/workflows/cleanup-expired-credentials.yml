# Scheduled deletion of expired certificate records (GDPR/APPI retention).
#
# Closes Annex VI item G6. `credentials/<certId>` is the public verification
# record behind a take-home certificate. It deliberately outlives its session —
# the session and the certIds/ map are purged at 30/90 days by
# cleanup-stale-sessions.yml, while a certificate has to stay verifiable for
# about five years. Until 2026-08-21 that "about five years" was an intention
# and nothing else: `retentionUntil` was written on every record and capped by
# the database rules, then never read back by anything. GDPR Art. 5(1)(e) is not
# satisfied by an intention, which is why the participant consent text could not
# state a retention period as fact.
#
# ⚠️ THE SCHEDULED RUN IS DRY-RUN ON PURPOSE. Read this before arming it.
#
#   Every other retention workflow here purges on its schedule, because each has
#   been deleting for months and its behaviour is known. This one has NEVER run
#   against production, and the population it targets has never been pruned — so
#   the first live run would be the largest deletion this project has ever
#   performed, against records whose whole purpose is to still be there when
#   someone checks a certificate. There is no undo.
#
#   So: leave CREDENTIALS_CONFIRM at 0, let a few scheduled runs report, and
#   read the counts. Look in particular at `Undated` — records with no usable
#   `at` or `retentionUntil`. The rules permit them (neither is a required
#   child), the job never deletes them, and a non-zero count means something is
#   writing records that can never expire.
#
#   Arm it by flipping the CREDENTIALS_CONFIRM expression below to mirror
#   cleanup-stale-sessions.yml (schedule => '1'). Until then a manual dispatch
#   with confirm=true is the only way this deletes anything.
#
# CREDENTIALS_QUIET=1 is set for the same reason as CLEANUP_QUIET in the session
# job: this repo's Actions logs are world-readable. The payload contains
# `session`, which is the session JOIN CODE, and a cert id is itself the read
# key for a public record. Neither belongs in a public log. For a verbose
# preview, run scripts/cleanup-expired-credentials.js locally.
#
# Runs daily at 04:07 UTC — off-:00 to avoid the cron stampede, and after the
# 03:17 session cleanup so the two never contend for the same database.

name: Cleanup expired credentials

on:
  schedule:
    - cron: "7 4 * * *"   # daily at 04:07 UTC
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually delete (otherwise just dry-run)"
        type: boolean
        required: true
        default: false
      retention_days:
        description: "Fallback window from 'at', for records with no retentionUntil (days)"
        type: string
        required: true
        default: "1826"

concurrency:
  group: cleanup-expired-credentials
  cancel-in-progress: false  # never kill a run mid-delete

jobs:
  cleanup:
    name: Purge expired certificate records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache.
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, not a floating install — see the long note in
      # cleanup-stale-sessions.yml. Short version: a `npm i --no-save
      # firebase-admin@13` pinned nothing, and an upstream publish broke all
      # four ops workflows for five days in 2026-07/08 with no change on our
      # side. The lockfile pins the tree by integrity hash, and
      # tests/firebase-admin-api-surface.test.js is the check that actually
      # rejects a breaking bump.
      - name: Install from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Write service-account credentials to a temp file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 }}
        run: |
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> "$GITHUB_ENV"

      - name: Run credential retention
        env:
          FIREBASE_DATABASE_URL: https://canamed-69785-default-rtdb.europe-west1.firebasedatabase.app
          # DRY-RUN on schedule, deliberately — see the header. Only an explicit
          # manual dispatch with confirm=true deletes anything today.
          CREDENTIALS_CONFIRM: ${{ github.event.inputs.confirm == 'true' && '1' || '0' }}
          CREDENTIALS_RETENTION_DAYS: ${{ github.event.inputs.retention_days || '1826' }}
          # PUBLIC repo: logs are world-readable — never print cert ids or the
          # session codes their payloads carry.
          CREDENTIALS_QUIET: "1"
        run: node scripts/cleanup-expired-credentials.js
