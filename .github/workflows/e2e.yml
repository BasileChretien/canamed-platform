# Playwright end-to-end tests for the CaNaMED PBL platform.
#
# Runs the suite under tests-e2e/ — splash render, facilitator create-session,
# admin dashboard, participant join — against a hermetic local server that
# serves docs/Third_session/PBL_platform/ with production-equivalent
# Content-Security-Policy headers. No real Firebase, no production database,
# no shared state between runs.
#
# A matrix runs the suite under chromium, firefox and webkit so cross-browser
# regressions are caught at PR time. Each browser is its own job so failures
# are reported per browser in the PR Checks tab.
#
# Required to pass before merging once branch protection picks it up. The
# existing Unit tests workflow (.github/workflows/test.yml) covers
# fast-feedback pure-function tests; this workflow covers end-to-end UI
# flows that pure-function tests cannot catch.

name: E2E tests

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    # 55, not 35, and not 20. This cap has now been set twice from the WRONG
    # measurement, so read the whole reasoning before touching it again.
    #
    # timeout-minutes is measured from JOB START — it covers checkout, the
    # dependency install and the Playwright browser install as well as the
    # suite. Both previous values were justified purely by TEST duration,
    # which is why both failed the same way:
    #
    #   - 20 was set against firefox's ~19.7 min for 437 tests. The suite
    #     printed "437 passed" and was cancelled 13 s later (#275).
    #   - 35 was set the same way, and broke identically on 2026-08-05:
    #       03:22:44  job starts
    #       03:22:53  Install Playwright browser (webkit)      0 m 09 s in
    #       03:38:51  Run E2E suite (webkit)                  15 m 58 s install
    #       03:57:55  460 passed (19.1m)                      19 m 04 s suite
    #       03:57:56  job cancelled              <- 35 m 12 s from JOB start
    #     Setup, not the suite, ate the margin: `playwright install --with-deps`
    #     apt-installs webkit's system libraries on a cache miss and took
    #     15 m 58 s. 0:09 + 15:58 + 19:04 = 35 m 11 s, one second inside the
    #     cap — with nothing wrong anywhere.
    #
    # A cancellation is indistinguishable from a real failure in the checks UI,
    # so each of these cost a merge cycle and diagnosis time while catching
    # nothing. The cap exists to bound a HUNG job, not to police a healthy
    # suite, and still kills a genuine hang.
    #
    # ⚠ CORRECTION (2026-08-05, #286). The line that used to close this block —
    # "the fix is to make the browser cache hit reliably" — was WRONG, and the
    # entry above misreads its own evidence. Reading the #284 log line by line:
    #
    #     03:22:54  Installing dependencies...        <- apt starts
    #     03:38:46  Downloading WebKit ...            <- apt ends, 15 m 52 s
    #     03:38:50  WebKit downloaded                 <- browser took 4 SECONDS
    #     "Fetched 114 MB in 15min 31s (123 kB/s)"    <- a degraded apt mirror
    #
    # The browser download was never the cost. apt was — and apt runs on BOTH
    # paths, because the cache-hit path still calls `playwright install-deps`.
    # A perfect cache hit would have saved ~5 seconds, not ~16 minutes.
    #
    # Proof, from #286's own CI: a webkit job whose browser cache HIT (install
    # step skipped) still died at this 55-minute cap, because its apt step took
    # 2411 s = 40 m 11 s. Across 64 samples that step is normally 20 s median /
    # 44 s p90 — so azure.archive.ubuntu.com has a 60-120x tail that no timeout
    # can absorb while still bounding a real hang.
    #
    # THE FIX IS THEREFORE TO NOT RUN apt AT ALL — see the `container:` below,
    # which ships the browsers and their system libraries preinstalled. The cap
    # stays 55 deliberately: a cap costs nothing when it is not hit, and it
    # should only be lowered once the container has a track record here.
    timeout-minutes: 55
    # The official Playwright image, which carries every browser AND its system
    # libraries at /ms-playwright — so this job needs no `playwright install`,
    # no `--with-deps` apt, and no ~/.cache/ms-playwright cache at all.
    #
    # ⚠ THE TAG MUST MATCH @playwright/test IN package-lock.json. A drifted tag
    # runs the suite against browsers built for a different Playwright, which
    # fails confusingly at launch. `tests/e2e-container-version.test.js` pins
    # the two together so drift fails a fast unit test instead of the matrix.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        # Desktop cross-browser matrix + mobile (iPhone + iPad on webkit,
        # Pixel 7 Android on chromium) device emulation. The "visual"
        # project (snapshot diffs, chromium only) is wired up but skipped
        # in CI by default — see tests-e2e/visual.spec.js for the
        # RUN_VISUAL=1 escape hatch used after baselines are committed.
        # Each entry is a Playwright PROJECT (see playwright.config.js), which
        # already declares its own engine via the device descriptor:
        # mobile-iphone/mobile-ipad ride webkit, mobile-android/a11y/perf ride
        # chromium. There used to be a parallel `browser:` include mapping here
        # purely to pick which engine to `playwright install` and to scope the
        # browser cache key. The container ships all three engines, so both the
        # installs and the cache are gone and that mapping became dead config —
        # removed rather than left to rot into another stale claim.
        project: [chromium, firefox, webkit, mobile-iphone, mobile-ipad, mobile-android, a11y, perf]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # package-lock.json has been committed since the initial commit and
          # is Dependabot-maintained, so the npm cache has a real lock to key
          # off. Pinned to the ROOT lock explicitly: the repo also carries
          # docs/Third_session/PBL_platform/functions/package-lock.json (used
          # by functions-ci.yml), and letting both into one key would evict
          # this cache every time the unrelated Functions deps move.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        # npm ci, not npm install: it installs the locked tree exactly, and
        # fails loudly if the lock has drifted from package.json rather than
        # silently resolving a different version than the other jobs got.
        run: npm ci --no-audit --no-fund

      # NOTE: there is deliberately no browser install and no browser cache
      # here. The container already has them. Re-adding `playwright install`
      # would put the apt step — and its 15-40 minute tail — back on the
      # critical path, which is the entire bug this job was rebuilt to escape.

      - name: Run E2E suite (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
