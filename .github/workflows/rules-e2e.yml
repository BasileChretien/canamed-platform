# Rules E2E — exercises database.rules.json against the real Firebase
# emulators (RTDB + Auth).
#
# WHY THIS EXISTS: the main E2E suite (.github/workflows/e2e.yml) runs the
# platform in LOCAL mode (in-browser LocalDB), so it NEVER touches
# database.rules.json. A rules regression — e.g. a write predicate that
# breaks the join flow, or a rule accidentally opened to `true` — ships
# invisibly. This job boots the Firebase emulators with the production
# rules and runs a smoke flow (facilitator create → participant join →
# advance) plus a negative check (a write to a denied path must be
# rejected), so rules regressions are caught at PR time.
#
# Requires Java (RTDB emulator) + the Chromium Playwright browser. The
# orchestration lives in `npm run test:e2e:rules`, i.e.
# scripts/ops/run-rules-e2e.js:
#   preflight the ports  →  build-emulator-rules.js
#   →  firebase emulators:exec "playwright test"  →  sweep any survivor
# The preflight + sweep exist because emulators:exec does not reliably reap
# the RTDB emulator (a Java grandchild), and a leftover listener makes the
# NEXT run validate the PREVIOUS run's rules — or hang — rather than fail.

name: Rules E2E

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-e2e:
    name: Rules E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache. The cached
          # ~/.npm also serves the firebase-tools install below (now
          # tools/firebase-cli, a separate lock — same shared download cache),
          # which is by far the heaviest download in this job. Deliberately
          # NOT keyed on that second lock too: it would make every root-lock
          # change invalidate the CLI's cached tarballs as well, and npm
          # already handles a partial cache hit by fetching only what's new.
          cache: npm
          cache-dependency-path: package-lock.json

      # The RTDB emulator is a Java process. firebase-tools requires a JDK
      # at version 21+ (it dropped support for older runtimes), so pin 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        # npm ci, not npm install — installs the locked tree exactly.
        # (The old ORDER-IS-LOAD-BEARING warning that lived here is retired:
        # firebase-tools no longer installs into THIS node_modules, so this
        # step can no longer wipe it. See the next step.)
        run: npm ci --no-audit --no-fund

      - name: Install the pinned firebase-tools CLI
        # PINNED 2026-08-17 (was `npm install --no-save firebase-tools`, which
        # floated on the registry `latest` tag with nothing locked at all).
        #
        # The old comment's reason for --no-save was sound — the CLI's tree is
        # 670 packages and must not enter the ROOT lock, or every `npm ci` in
        # CI (all 8 E2E matrix jobs included) would pay for it. But --no-save
        # bought that at the price of no pinning whatsoever, which is the same
        # exposure that took out the four ops workflows for five days over
        # 2026-07-31..08-04 (see cleanup-stale-sessions.yml). Note that break
        # came from a TRANSITIVE dependency, so pinning only the top-level
        # version here would not have prevented the analogous failure.
        #
        # So the CLI now lives in tools/firebase-cli as its OWN package with
        # its OWN lockfile: the whole tree is pinned by integrity hash and the
        # root lock is untouched. Dependabot watches that directory (see
        # .github/dependabot.yml) so the pin still gets security bumps.
        working-directory: tools/firebase-cli
        run: npm ci --no-audit --no-fund

      - name: Show which firebase CLI is pinned
        # Cheap, and it makes the pin auditable from the job log rather than
        # only from the lockfile. run-rules-e2e.js logs the same resolution.
        run: ./tools/firebase-cli/node_modules/.bin/firebase --version

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Cache the emulator jar so it isn't re-downloaded every run.
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run rules E2E against the emulator
        run: npm run test:e2e:rules
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rules-e2e-report
          path: playwright-report/
          retention-days: 14
