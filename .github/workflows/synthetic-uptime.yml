# Synthetic uptime probe for the CaNaMED platform.
#
# Runs every 15 minutes from outside Firebase's network so we know the
# production splash + privacy pages are reachable. If the probe fails,
# the job goes red and the operator gets an email (GitHub default
# notification for failed workflows on the default branch).
#
# ⚠ THE CRON IS NOMINAL. IT IS NOT THE CADENCE YOU GET. The paragraph that
# used to sit here justified */15 as "a balance between detection latency (a
# session usually has 20+ minutes of setup before students arrive) and GitHub
# Actions minute budget (15min cadence = 96 runs/day = ~10 min/day)". Both
# halves are wrong in practice, measured across the last 100 scheduled runs
# (2026-07-29 21:38 -> 2026-08-07 00:05 UTC):
#
#     ticks expected             778    actually ran  100    = 13%
#     median INTERVAL between probes   106.6 min
#     p90 interval                     197.2 min
#     max interval                     371.9 min   (6.2 h with no probe)
#
# ⚠ Those are INTERVALS BETWEEN RUNS, not detection latency, and the
# difference matters in both directions. This probe was never sampled against
# a known outage, so nothing here measures how quickly one gets noticed. What
# the intervals bound is when the site is LOOKED AT:
#   - an incident starting just after a probe is invisible until the next one,
#     so the wait is up to the whole interval and averages about half of it
#     for an arbitrary onset — but the tail is the part to plan around, and
#     the tail here is hours;
#   - an outage SHORTER than the current interval can begin and end between
#     two probes and never be observed at all. That is not late detection,
#     it is no detection, and no cron cadence removes it.
#
# GitHub runs `schedule` on public repos best-effort and drops ticks under
# load, which is what produces those intervals. The cost half of the old
# rationale is wrong in the opposite direction: ~8x lower than the 96 runs/day
# it assumed, making that argument moot rather than load-bearing.
#
# Reproduce:
#   gh api "repos/BasileChretien/canamed-platform/actions/workflows/\
# synthetic-uptime.yml/runs?per_page=100" \
#     --jq '[.workflow_runs[]|select(.event=="schedule")|.created_at]'
#
# ⚠ SO DO NOT TREAT THIS AS THE PRE-SESSION GATE. That is healthcheck.html —
# an on-demand page whose own lead text says "open it ~30 minutes before each
# live session", and whose `firebase-db` / `app-check` rows probe the backends
# from the browser with real auth. This workflow is the unattended, between-
# sessions watcher; it cannot promise a bound on how stale its last answer is.
#
# The cron is LEFT AT */15 deliberately. Moving it off the quarter-hour (the
# most contended minutes) is the usual advice, but the effect here is
# unmeasured, and a change whose benefit cannot be demonstrated does not
# belong in a monitor. The durable fix is an external uptime service, which is
# an infrastructure decision, not a code change.
#
# Run manually:
#   gh workflow run synthetic-uptime.yml
#
# ── READ THIS BEFORE DIAGNOSING A RED RUN ────────────────────────────────
# A red run here does NOT imply the site was down. Of the three non-success
# runs in the last 100, the probe never executed in two of them. So ask which
# STEPS ran and how each ended, not just whether the run failed:
#
#   gh api repos/BasileChretien/canamed-platform/actions/runs/<id>/jobs \
#     --jq '.jobs[] | {conclusion, runner_name,
#                      steps: [.steps[] | "\(.name)=\(.conclusion)"]}'
#
# Read the answer like this:
#   runner_name "" and steps []     -> GitHub never allocated a runner; the
#                                      site was NEVER TESTED (seen 2026-08-06
#                                      17:53: pending 15 m 02 s, then killed)
#   steps stop before the probe     -> setup consumed the job; NEVER TESTED
#                                      (seen 2026-08-06 15:53, `Set up job`
#                                      alone took 2 m 33 s)
#   "Run synthetic probe=failure"   -> the only case that says anything about
#                                      production; now read that step's log
#
# (The list-jobs endpoint does include the steps array, with per-step
# conclusions — verified against this repo on 2026-08-07. If you already have
# a job id, `gh api .../actions/jobs/<job_id>` returns the same detail.)

name: Synthetic uptime probe

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

# NO `concurrency:` BLOCK — deliberately. There used to be one
# (group: synthetic-uptime, cancel-in-progress: false, "let each tick
# complete; don't piggyback"). GitHub allows only ONE pending run per
# concurrency group, so when a run sits pending across a cron tick the older
# pending run is CANCELLED — and this probe demonstrably can sit pending for
# a full tick (2026-08-06 17:53 waited 15 m 02 s for a runner). In that state
# the group can only ever convert "GitHub had no runners" into a red run and
# an operator email; it cannot make the probe more correct.
#
# Honesty note: no competing run exists in the API history for 18:08, so the
# group is NOT confirmed to have caused that specific eviction. It is removed
# because it carries that failure mode with no upside — three read-only GETs
# are harmless to run concurrently, and at a 15-minute cadence against a job
# that normally finishes in well under a minute, overlap is near-impossible
# anyway.

jobs:
  probe:
    name: probe canamed-69785.web.app
    runs-on: ubuntu-latest
    # 12 at the JOB level, 5 on the probe STEP — not 3 on the job.
    #
    # `timeout-minutes` on a job is measured from JOB START, so it covers
    # runner setup, checkout and setup-node as well as the probe. The old
    # `timeout-minutes: 3` was sized for the probe alone and duly killed a
    # run that was doing nothing wrong: on 2026-08-06 15:53 the `Set up job`
    # step ALONE took 2 m 33 s (15:56:19 -> 15:58:52) and the job was
    # cancelled 3 m 32 s after starting, before checkout finished. The probe
    # never ran, and the red X is indistinguishable from a real outage.
    #
    # This is the fourth time this exact defect has been paid for in this
    # repo (#275, #284, #286 in e2e.yml — see the long note there). The fix
    # is the same one: bound the WORK at the step, and leave the job cap
    # loose enough that infrastructure cannot consume it.
    #
    # 6 on the step is above the probe's worst case: 3 HTML checks x (3
    # attempts x 15 s + 7 s backoff) + 2 backend checks x (3 attempts x 10 s
    # + 7 s backoff) = 3 m 50 s. A healthy run is ~1 s.
    # `tests/synthetic-uptime.test.js` pins step < job and worst-case < step
    # using the script's OWN arithmetic, so retuning the retry budget without
    # the cap (or vice versa) fails a fast unit test rather than a scheduled
    # run at 03:00.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing after this step runs a git command — the probe only reads
          # the checked-out source. Without this, actions/checkout leaves the
          # workflow token in .git/config where every later step could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run synthetic probe
        timeout-minutes: 6
        run: node scripts/synthetic-uptime-check.js
        env:
          PROBE_URL: https://canamed-69785.web.app
          # ── hfPatient check: OFF while the project is on Spark ───────────
          # Cloud Functions v2 runs on Cloud Run and needs a Blaze plan. The
          # billing trial ended 2026-08-27 and was deliberately not renewed,
          # so hfPatient returns a front-end 500 with no application logs and
          # CANNOT pass. Left armed it turned every run red and mailed the
          # operator ~4x/day about something no code change can fix.
          #
          # The check is GATED, never silent: the probe prints an explicit
          # "[SKIP] hfPatient <reason>" line above its results, so a green run
          # cannot be read as "the callable was checked".
          #
          # ⚠ SET THIS TO "1" IN THE SAME CHANGE THAT RESTORES BILLING. It is
          # also the only CLI-verifiable signal for whether App Check is
          # ENFORCING on the callable (functions/.env is git-ignored), so
          # leaving it off with a live function makes that state uncheckable —
          # the stale-label failure the STATUS-CLAIM RULE in CLAUDE.md exists
          # to prevent.
          PROBE_EXPECT_FUNCTIONS: "0"
