# Dependabot config — keeps npm + GitHub Actions dependencies fresh
# without manual chasing. Free for public + private GitHub repos.
#
# Scope today:
#   - npm: the dev-dependency tree (currently @playwright/test). Used by
#     the E2E suite; updates land as PRs we can review on the existing
#     CI gates (Unit tests + Playwright E2E).
#   - github-actions: the workflows themselves (actions/checkout,
#     actions/setup-node, actions/upload-artifact, actions/cache,
#     microsoft/playwright-github-action if/when added). Updates here
#     keep the runners on current Node + cache-format versions.
#
# NOT covered:
#   - The Firebase JS SDK (loaded from gstatic with SRI hashes pinned
#     in index.html / firebase-deploy headers). Dependabot can't see
#     CDN-loaded scripts. Use scripts/update-firebase-sri.sh to bump
#     the version + recompute the integrity hashes when Firebase
#     publishes a new SDK — schedule a quarterly reminder.
#   (firebase-admin was listed here as NOT covered, because the ops
#   workflows installed it one-shot with `npm i --no-save`. That stopped
#   being true in #316, 2026-08-17: it is a root devDependency in the
#   committed lock now, so the "/" entry below already covers it, and the
#   four ops workflows install it with `npm ci`.)
#   (firebase-tools was likewise uncovered until 2026-08-17 — it now has
#   its own package + lock under tools/firebase-cli, watched below.)
#
# Schedule: weekly Mondays, 04:18 UTC. Off-:00 minute and offset from
# the daily cleanup/backup crons to avoid runner contention.
# Open-PR cap: 4 — enough breathing room without flooding.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "npm"
    # (A firebase-admin semver-major ignore lived here 2026-08-17 and was
    # LIFTED the same day, once the bump it was holding back actually landed.
    # v14 removed the namespaced accessors (admin.database / admin.storage)
    # that the four ops scripts used; the scripts moved to the modular API and
    # the repo is now ON v14. Nothing left to hold.
    #
    # ⚠ SIDE EFFECT WORTH KNOWING BEFORE ADDING ANOTHER IGNORE HERE: adding
    # that ignore made Dependabot CLOSE its open PR for the package within
    # minutes — "Looks like firebase-admin is no longer being updated by
    # Dependabot, so this is no longer needed" (#320, closed 04:51 UTC). An
    # ignore is not a pause button; it retires the PR you may be relying on as
    # a tracking marker. Use a draft issue for that instead.
    #
    # The real safety net is tests/firebase-admin-api-surface.test.js, which
    # derives the entry points scripts/ imports and fails if an installed
    # version stops exporting them — it caught v14 before the migration and
    # passes on v14 after it. That test, not an ignore, is what makes a
    # firebase-admin bump reviewable.)
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # The pinned firebase-tools CLI has its OWN package.json + lock under
  # tools/firebase-cli, kept out of the root lock on purpose (670 packages
  # that only the rules-E2E job needs). Watched here so pinning it does not
  # mean freezing it — an unwatched pin just ages into a stale, unpatched
  # one. Added 2026-08-17 with the pin itself.
  - package-ecosystem: "npm"
    directory: "/tools/firebase-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "firebase-tools"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cloud Functions have their OWN package.json (nodemailer, firebase-admin,
  # sanitize-html) — watched separately so the functions tree gets auto-bumps
  # too (added 2026-05-30 after a security review flagged a stale nodemailer).
  - package-ecosystem: "npm"
    directory: "/docs/Third_session/PBL_platform/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "npm"
      - "functions"
    # (A firebase-admin semver-major ignore lived here from 2026-05-30 and was
    # LIFTED 2026-08-17. Its two stated blockers are both gone:
    #   1. "firebase-functions peers ^11 || ^12 || ^13, so v14 fails ERESOLVE"
    #      — firebase-functions is 7.3.2 now and peers
    #      `^11.10.0 || ^12.0.0 || ^13.0.0 || ^14.0.0`. Confirmed by a clean
    #      `npm ci` in this directory resolving admin 14.2.0 alongside
    #      functions 7.3.2, with no ERESOLVE.
    #   2. "index.js is written against the namespaced accessors" — it moved
    #      to getDatabase (firebase-admin/database) on 2026-08-17, and loads
    #      cleanly on v14 via the same check Functions CI runs.
    # This directory is now ON v14. Nothing left to hold.)
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
