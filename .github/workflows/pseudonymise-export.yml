# Daily pseudonymised export of /sessions for research → PRIVATE GCS.
#
# PUBLIC-REPO variant. Produces two objects in a private GCS bucket:
#   - pseudonymised/canamed-pseudonymised-DATE.json — real names replaced
#     by Student-A/B/... per session; researchers consume this. Long
#     (~90d) lifecycle.
#   - linkage/canamed-linkage-DATE.json — maps pseudonyms back to real
#     names; used only to honour GDPR Art. 17 erasure on a closed session.
#     SHORT (~14d) lifecycle.
#
# Why GCS and not a GitHub artifact: this is a public repo, where artifacts
# are downloadable by anyone with read access. The linkage table is the
# crown jewels (re-identifies every participant), so it must never touch a
# public-repo artifact. The job log itself prints only counts — no names.
#
# LIVE since 2026-05-30 — the bucket setup documented in
# .github/workflows/backup-sessions.yml is complete, so the daily
# `schedule:` is enabled. Only CLOSED sessions are exported.

name: Pseudonymised export

on:
  # ⚠ SCHEDULE DISABLED 2026-08-31 — NOT a pause, and not a decision about
  # whether the research export matters.
  #
  # This job writes to Google Cloud Storage (gs://canamed-pii-archive), and
  # GCS requires a billing account. The project's Blaze trial ended on
  # 2026-08-27 and was deliberately not renewed, so the billing account is in
  # state `closed` and every run since has died with:
  #
  #     FATAL: ApiError: The billing account for the owning project is
  #            disabled in state closed
  #
  # It failed daily for four days, mailing the operator each time about a
  # condition no code change can fix. CLAUDE.md already records what that
  # costs — four failure emails a day from jobs believed retired was called
  # out as "pure alert fatigue, which is exactly the condition under which a
  # real failure gets ignored". Leaving this on rebuilds that state knowingly.
  #
  # `workflow_dispatch` is KEPT so the job can be run by hand the moment
  # billing is restored — which is also the test that it still works.
  #
  # TO RESTORE: re-attach a billing account to canamed-69785, then uncomment
  # the schedule below.
  #
  # NB this one exports only CLOSED, research-CONSENTED sessions. Its pause
  # therefore delays research reuse; it does not affect any retention duty,
  # which cleanup-stale-sessions discharges independently and is still running.
  # schedule:
  #   - cron: "47 3 * * *   # daily 03:47 UTC — after cleanup (03:17)"
  workflow_dispatch:

concurrency:
  group: pseudonymised-export
  cancel-in-progress: false

jobs:
  export:
    name: Pseudonymise + export /sessions to private GCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache.
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, NOT the old `npm i --no-save firebase-admin@13` — see
      # cleanup-stale-sessions.yml for the full rationale (a floating
      # transitive dep broke all four ops workflows for five days,
      # 2026-07-31 to 2026-08-04). firebase-admin is a devDependency and
      # the lockfile pins its whole tree.
      - name: Install from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Write service-account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 }}
        run: |
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> "$GITHUB_ENV"

      - name: Pseudonymise + export to private GCS (no artifact upload)
        env:
          FIREBASE_DATABASE_URL: https://canamed-69785-default-rtdb.europe-west1.firebasedatabase.app
          EXPORT_GCS_BUCKET: ${{ vars.PII_ARCHIVE_BUCKET }}
          EXPORT_GCS_PSEUDO_PREFIX: pseudonymised
          EXPORT_GCS_LINKAGE_PREFIX: linkage
          EXPORT_REQUIRE_GCS: "1"
        run: node scripts/pseudonymise-export.js
