# Scheduled cleanup of stale CaNaMED sessions (GDPR/APPI retention).
#
# GDPR Art. 5(1)(e) "storage limitation" + APPI Art. 21 require that
# personal data isn't kept longer than needed. The privacy policy commits
# us to: identified data ≤ 30 days after session close, abandoned sessions
# ≤ 90 days after creation. This workflow enforces that schedule.
#
# Since 2026-08-12 it also prunes the hfPatient metrics tree (≤ 30 days).
# Those rows hang off no session, so the session walk never reached them and
# they had accumulated with no retention at all since the LLM pilot launched.
# They are uid-keyed — pseudonymous personal data, not anonymous counters.
# The per-day `global/` aggregate carries no identifier and is kept.
#
# WHY THIS LIVES IN THE PUBLIC REPO (moved 2026-05-29):
#   The retention workflows originally ran on the private
#   BasileChretien/CANAMED repo, but that account's GitHub Actions are
#   blocked by a billing-payment failure ("the job was not started because
#   recent account payments have failed"), so every scheduled AND manual
#   run there has failed since ~2026-05-18 — meaning retention silently
#   stopped. This public repo's Actions are healthy, so the retention is
#   restored here, off the broken-billing dependency.
#
#   Only the NO-ARTIFACT retention jobs (this one + cost-monitor) were
#   moved. backup-sessions and pseudonymise-export upload artifacts
#   containing identified PII (full names; a pseudonym→name linkage
#   table). On a PUBLIC repo, anyone with read access — i.e. everyone —
#   can download run artifacts, so moving those here would turn a
#   retention gap into a PII breach. They must run somewhere with private
#   artifact storage (a private repo with working Actions, or write to a
#   private GCS bucket).
#
#   CLEANUP_QUIET=1 is set below because this repo's Actions logs are
#   world-readable: without it the per-session report prints session
#   join-codes, and codes of not-yet-expired ("KEEP") sessions could
#   still be live/joinable. Quiet mode emits only the summary counts.
#   For a verbose dry-run preview, run scripts/cleanup-stale-sessions.js
#   locally (private logs), not via this workflow.
#
# Runs daily at 03:17 UTC (deliberately off-:00 to avoid the cron
# stampede). The scheduled run purges (CONFIRM=1); the manual dispatch
# defaults to dry-run so an operator can preview before deleting.

name: Cleanup stale sessions

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually delete (otherwise just dry-run)"
        type: boolean
        required: true
        default: false
      retention_closed_days:
        description: "Retention after close (days)"
        type: string
        required: true
        default: "30"
      retention_open_days:
        description: "Retention for abandoned sessions (days)"
        type: string
        required: true
        default: "90"
      retention_metrics_days:
        description: "Retention for hfPatient metrics (days)"
        type: string
        required: true
        default: "30"

concurrency:
  group: cleanup-stale-sessions
  cancel-in-progress: false  # don't kill a running cleanup mid-delete

jobs:
  cleanup:
    name: Purge expired sessions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache.
          cache: npm
          cache-dependency-path: package-lock.json

      # WHY npm ci AND NOT `npm i --no-save firebase-admin@13` (changed
      # 2026-08-17) — the full rationale for all four ops workflows
      # (backup-sessions, cleanup-stale-sessions, cost-monitor,
      # pseudonymise-export), which shared the old floating install:
      #
      # That one-shot install pinned nothing. `firebase-admin@13` resolved
      # its entire transitive tree fresh on every run, so a single bad
      # publish anywhere beneath it broke all four jobs at once, with no
      # change on our side and no way to roll back.
      #
      # It happened: @firebase/database-compat 2.1.5 (published 2026-07-30
      # 18:29 UTC) shipped a dist/index.standalone.js — the bundle
      # firebase-admin loads — that require()s @firebase/app, which 2.1.5
      # declares only as a *peer* dependency, so npm never installed it.
      # Every run died on `Cannot find module '@firebase/app'`. All four
      # workflows failed on all five days from 2026-07-31 to 2026-08-04 —
      # no /sessions backup, no stale-session purge, no pseudonymised
      # export — a GDPR/APPI storage-limitation gap. They self-healed on
      # 2026-08-05 only because upstream reverted the bundle in 2.1.6.
      #
      # firebase-admin now lives in devDependencies and the lockfile pins
      # the whole tree by integrity hash. An upstream regression can no
      # longer arrive unattended: it comes as a Dependabot PR that CI gets
      # to reject first.
      #
      # ⚠ CORRECTION (2026-08-17): when the paragraph above was written, that
      # last clause was an OVERCLAIM. Making the dependency visible to
      # Dependabot worked — but NO CI job required firebase-admin, so there
      # was no check to do the rejecting. This job and its three siblings run
      # only on their nightly cron; a breaking bump would have been fully
      # green on the PR and failed at 03:00. Dependabot #320 (v14.2.0, which
      # removes admin.database / admin.storage) demonstrated it within a day.
      # The claim is now true because tests/firebase-admin-api-surface.test.js
      # exists: it derives the firebase-admin entry points these scripts import
      # and asserts the installed package exports them, so a breaking version
      # fails in the unit job in ~50 ms. Do not delete that test without
      # restoring some other check here — the visibility alone never was one.
      #
      # The scripts themselves moved to the modular API on 2026-08-17
      # (getDatabase / getStorage), which v13 and v14 expose identically, so
      # the v14 boundary specifically no longer threatens them.
      - name: Install from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Write service-account credentials to a temp file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 }}
        run: |
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> "$GITHUB_ENV"

      - name: Run cleanup
        env:
          FIREBASE_DATABASE_URL: https://canamed-69785-default-rtdb.europe-west1.firebasedatabase.app
          # Scheduled runs purge by default; manual dispatch follows the dropdown.
          CLEANUP_CONFIRM: ${{ (github.event_name == 'schedule' || github.event.inputs.confirm == 'true') && '1' || '0' }}
          CLEANUP_RETENTION_CLOSED_DAYS: ${{ github.event.inputs.retention_closed_days || '30' }}
          CLEANUP_RETENTION_OPEN_DAYS:   ${{ github.event.inputs.retention_open_days   || '90' }}
          # hfPatient metrics (uid-keyed, no session to expire with) — see the
          # script header. Kept at the identified-data window; these rows are
          # only pseudonymous, so 30d is conservative rather than lax.
          CLEANUP_RETENTION_METRICS_DAYS: ${{ github.event.inputs.retention_metrics_days || '30' }}
          # PUBLIC repo: logs are world-readable — never print raw session codes.
          CLEANUP_QUIET: "1"
        run: node scripts/cleanup-stale-sessions.js
