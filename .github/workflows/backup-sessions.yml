# Daily snapshot of /sessions from the live Realtime Database → PRIVATE GCS.
#
# This is the PUBLIC-REPO variant of the backup job. The original
# private-repo workflow uploaded the snapshot as a GitHub Actions artifact;
# that is unsafe here because public-repo artifacts are downloadable by
# anyone with read access (everyone), and the snapshot contains identified
# PII (the full /sessions tree). Instead this job writes the snapshot to a
# PRIVATE GCS bucket — the job log carries no PII, and the PII lands where
# only the service account and project admins can read it.
#
# ───────────────────────────────────────────────────────────────────────
# ⚠ THE DESTINATION IS SCALEWAY OBJECT STORAGE, NOT GCS (since 2026-09-02).
# GCS needs an active billing account and the project is on Spark, so it is
# unwritable; see scripts/lib/s3-archive.js for the two probes that
# established that. The GCS steps further down are kept as HISTORICAL
# reference, for if billing is ever restored — they are not the current
# configuration.
#
# CURRENT SETUP (done 2026-09-02, working and verified):
#   Bucket   canamed-pii-archive · region fr-par (Paris) · visibility PRIVATE
#   Lifecycle  backups/ 90d · pseudonymised/ 90d · linkage/ 14d
#   Variable   PII_ARCHIVE_S3_BUCKET = canamed-pii-archive
#   Secrets    SCW_ACCESS_KEY / SCW_SECRET_KEY (Scaleway API key)
#
# ⚠ THE API KEY EXPIRES. Scaleway caps API keys at 12 months, so this one
# dies and the nightly backup starts failing — silently, from the operator's
# point of view, because a credential does not announce its own expiry. The
# date below is machine-read by tests/scaleway-key-currency.test.js, which
# goes red ~45 days ahead with rotation instructions. Update it in the SAME
# change that rotates the key.
#
#   SCW_KEY_EXPIRES: 2027-09-02
#
# The key's ACCESS KEY ID is deliberately not recorded here: this repo is
# public, and while an access key id is not a credential on its own, there
# is no reason to publish one. Identify the key in the Scaleway console by
# its description, "GitHub Actions - nightly PII archive to
# canamed-pii-archive".
#
# ⚠ When generating a replacement, the dialog's "Will this API key be used
# for Object Storage?" defaults to "No, skip for now". It MUST be "Yes" with
# the Canamed project selected, or the key is valid but cannot resolve the
# bucket.
#
# HISTORICAL — the GCS setup, completed 2026-05-30, unusable while on Spark:
#   1. Create a PRIVATE bucket in the EU (data residency = the RTDB's
#      europe-west1), uniform bucket-level access, no public IAM:
#        gcloud storage buckets create gs://canamed-pii-archive \
#          --project=canamed-69785 --location=europe-west1 \
#          --uniform-bucket-level-access --public-access-prevention
#   2. Grant the deploy service account object admin on JUST this bucket
#      (SA email is in the FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 secret,
#      field client_email — typically
#      firebase-adminsdk-xxxxx@canamed-69785.iam.gserviceaccount.com):
#        gcloud storage buckets add-iam-policy-binding gs://canamed-pii-archive \
#          --member=serviceAccount:<that-email> --role=roles/storage.objectAdmin
#   3. Add lifecycle rules so archives auto-delete on the retention policy
#      (backups/ + pseudonymised/ = 90d, linkage/ = 14d). Example
#      lifecycle.json + apply:
#        gcloud storage buckets update gs://canamed-pii-archive \
#          --lifecycle-file=lifecycle.json
#   4. Point the workflows at the bucket via a repo VARIABLE (not a secret;
#      a bucket name is not sensitive):
#        gh variable set PII_ARCHIVE_BUCKET --body "canamed-pii-archive"
#   5. Manually dispatch this workflow + pseudonymise-export once; confirm
#      green and that the objects appear in the bucket.
#   6. Uncomment the `schedule:` block below and push.
# ───────────────────────────────────────────────────────────────────────

name: Backup sessions

on:
  # ✅ SCHEDULE RE-ENABLED 2026-09-01, and the destination moved to Scaleway
  # object storage the same day. It had been disabled since 2026-08-27, when
  # the Blaze trial ended and GCS became unwritable — five days during which
  # the nightly purge deleted sessions with NO archive behind it.
  #
  # The purge interlock (CLEANUP_REQUIRE_BACKUP in cleanup-stale-sessions.yml)
  # was armed on 2026-09-02, AFTER a backup had actually succeeded and been
  # verified in the bucket. Order matters: arming it against a destination
  # that has never worked stops the purge on its first run, which turns a
  # missing-archive problem into a retention breach.
  #
  # So this job and that gate are now coupled — if this schedule is ever
  # disabled again, disarm the interlock in the SAME change, or the purge
  # stops within CLEANUP_BACKUP_MAX_AGE_DAYS.
  schedule:
    - cron: "47 2 * * *"  # daily 02:47 UTC — 30 min before cleanup (03:17)
  workflow_dispatch:
    inputs:
      bucket:
        description: "Archive bucket to use (blank = the PII_ARCHIVE_BUCKET variable)"
        required: false
        default: ""

concurrency:
  group: backup-sessions
  cancel-in-progress: false  # never kill an in-flight backup

jobs:
  backup:
    name: Snapshot /sessions to a private GCS bucket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache.
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, NOT the old `npm i --no-save firebase-admin@13` — see
      # cleanup-stale-sessions.yml for the full rationale (a floating
      # transitive dep broke all four ops workflows for five days,
      # 2026-07-31 to 2026-08-04). firebase-admin is a devDependency and
      # the lockfile pins its whole tree.
      - name: Install from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Write service-account credentials to a temp file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 }}
        run: |
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> "$GITHUB_ENV"

      - name: Backup /sessions to private GCS (no artifact upload)
        env:
          FIREBASE_DATABASE_URL: https://canamed-69785-default-rtdb.europe-west1.firebasedatabase.app
          # An override lets an operator point a run at a different bucket without
          # touching the repo variable -- used to test whether a candidate bucket is
          # writable at all before committing the schedule to it.
          # Scaleway Object Storage (fr-par, Paris). Added 2026-09-01 because GCS
          # needs an active billing account and the project is on Spark, so the
          # backup had produced nothing since 2026-08-27 while the nightly purge
          # kept deleting. Scaleway was already a disclosed sub-processor with a
          # DPA in force, so this adds no new vendor and no new paperwork.
          # A blank BACKUP_S3_BUCKET falls back to the GCS path below.
          BACKUP_S3_BUCKET: ${{ vars.PII_ARCHIVE_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.PII_ARCHIVE_S3_ENDPOINT || 'https://s3.fr-par.scw.cloud' }}
          BACKUP_S3_REGION: ${{ vars.PII_ARCHIVE_S3_REGION || 'fr-par' }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BACKUP_GCS_BUCKET: ${{ github.event.inputs.bucket != '' && github.event.inputs.bucket || vars.PII_ARCHIVE_BUCKET }}
          BACKUP_GCS_PREFIX: backups
          # PUBLIC repo: fail loudly if the bucket isn't configured, so a
          # missing PII_ARCHIVE_BUCKET never becomes a backup that vanishes
          # with the runner.
          BACKUP_REQUIRE_GCS: "1"
        run: node scripts/backup-sessions.js
