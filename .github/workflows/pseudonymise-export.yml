# Daily pseudonymised export of /sessions for research → PRIVATE GCS.
#
# PUBLIC-REPO variant. Produces two objects in a private GCS bucket:
#   - pseudonymised/canamed-pseudonymised-DATE.json — real names replaced
#     by Student-A/B/... per session; researchers consume this. Long
#     (~90d) lifecycle.
#   - linkage/canamed-linkage-DATE.json — maps pseudonyms back to real
#     names; used only to honour GDPR Art. 17 erasure on a closed session.
#     SHORT (~14d) lifecycle.
#
# Why GCS and not a GitHub artifact: this is a public repo, where artifacts
# are downloadable by anyone with read access. The linkage table is the
# crown jewels (re-identifies every participant), so it must never touch a
# public-repo artifact. The job log itself prints only counts — no names.
#
# LIVE since 2026-05-30 — the bucket setup documented in
# .github/workflows/backup-sessions.yml is complete, so the daily
# `schedule:` is enabled. Only CLOSED sessions are exported.

name: Pseudonymised export

on:
  # SCHEDULE-STATE: live
  #
  # ✅ Live since 2026-09-01 (#363), writing to Scaleway object storage in
  # fr-par (Paris) instead of Google Cloud Storage.
  #
  # ⚠ THE LINE ABOVE IS CHECKED BY A TEST — it is not decoration. Keep it in
  # lockstep with the `schedule:` block below; `tests/dpa-export-lockstep.test.js`
  # fails if they disagree, and so does clause 2.6 of legal/dpa-draft.md, whose
  # Art. 28(10) analysis turns on whether this job runs. The permitted values are
  # exactly `live` and `disabled`.
  #
  # WHY A MACHINE-READABLE MARKER RATHER THAN PROSE. This header used to state,
  # at length, that the schedule was off — true when written on 2026-08-31 (the
  # Blaze trial had closed, GCS was unwritable, the job failed daily). #363 then
  # re-enabled the schedule after migrating the destination, and did not touch
  # the comment. For a day the file asserted its own inverse, and on 2026-09-02
  # a reader who trusted the comment over the YAML drafted a DPA clause saying
  # the central research export had STOPPED, when it runs nightly and produces a
  # real-name -> pseudonym linkage table. One designated line is checkable;
  # paragraphs are not.
  #
  # ⚠ LEGAL PRECONDITION, not a technical one. This job runs on the OPERATOR'S
  # schedule over EVERY facilitator's closed sessions and produces a real-name
  # → pseudonym linkage table. That is the GDPR Art. 28(10) exposure in clause
  # 2.6(a) of the draft DPA, and the election that clause requires has NOT been
  # made. Before the DPA is signed, either make the election or stop this job.
  #
  # NB it exports only CLOSED, research-CONSENTED sessions (scripts/lib/
  # pseudonymise.js). Pausing it delays research reuse only; it affects no
  # retention duty — cleanup-stale-sessions discharges those independently.
  schedule:
    - cron: "47 3 * * *"  # daily 03:47 UTC — after cleanup (03:17)
  workflow_dispatch:

concurrency:
  group: pseudonymised-export
  cancel-in-progress: false

jobs:
  export:
    name: Pseudonymise + export /sessions to private GCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Keyed on the ROOT lock only — the repo also has
          # docs/Third_session/PBL_platform/functions/package-lock.json
          # (functions-ci.yml), which must not evict this cache.
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, NOT the old `npm i --no-save firebase-admin@13` — see
      # cleanup-stale-sessions.yml for the full rationale (a floating
      # transitive dep broke all four ops workflows for five days,
      # 2026-07-31 to 2026-08-04). firebase-admin is a devDependency and
      # the lockfile pins its whole tree.
      - name: Install from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Write service-account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CANAMED_69785 }}
        run: |
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> "$GITHUB_ENV"

      - name: Pseudonymise + export to private GCS (no artifact upload)
        env:
          FIREBASE_DATABASE_URL: https://canamed-69785-default-rtdb.europe-west1.firebasedatabase.app
          # Scaleway Object Storage (fr-par, Paris). Added 2026-09-01 because GCS
          # needs an active billing account and the project is on Spark, so the
          # backup had produced nothing since 2026-08-27 while the nightly purge
          # kept deleting. Scaleway was already a disclosed sub-processor with a
          # DPA in force, so this adds no new vendor and no new paperwork.
          # A blank BACKUP_S3_BUCKET falls back to the GCS path below.
          BACKUP_S3_BUCKET: ${{ vars.PII_ARCHIVE_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.PII_ARCHIVE_S3_ENDPOINT || 'https://s3.fr-par.scw.cloud' }}
          BACKUP_S3_REGION: ${{ vars.PII_ARCHIVE_S3_REGION || 'fr-par' }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          EXPORT_GCS_BUCKET: ${{ vars.PII_ARCHIVE_BUCKET }}
          EXPORT_GCS_PSEUDO_PREFIX: pseudonymised
          EXPORT_GCS_LINKAGE_PREFIX: linkage
          EXPORT_REQUIRE_GCS: "1"
        run: node scripts/pseudonymise-export.js
