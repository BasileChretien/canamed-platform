# Auto-merge for Dependabot pull requests.
#
# Dependabot opens dependency-bump PRs (npm + github-actions, see
# .github/dependabot.yml). This workflow turns on GitHub's native
# auto-merge for them so they merge themselves once the required CI gates
# pass (Unit tests + the Playwright matrix + Rules E2E) — no manual
# merge-button babysitting.
#
# Policy:
#   - github-actions bumps: auto-merge any version jump (incl. major).
#     These touch only CI tooling and are fully exercised by the matrix.
#   - npm bumps: auto-merge patch + minor only. A major (potentially
#     breaking) bump to a dependency that ships from the deploy source is
#     left for a human to review and merge by hand.
#
# main is the deploy source for canamed-69785.web.app and is protected
# (PR required, CI required, no direct push). Auto-merge respects every
# branch-protection gate: it only removes the final manual click once all
# gates are green, and it can never merge anything CI rejects.
#
# WHY A GITHUB APP TOKEN, NOT GITHUB_TOKEN (changed 2026-09-30): GitHub
# performs an auto-merge as whoever ENABLED it. Enabled with GITHUB_TOKEN,
# the merge is pushed by github-actions[bot], and GitHub never starts a
# workflow from a GITHUB_TOKEN push. So every Dependabot merge landed on
# main with no E2E, no unit tests and, because firebase-deploy.yml runs
# after main's E2E, no deploy. Nothing went red; main just went unchecked.
# A GitHub App installation token has no such restriction. Guarded by
# tests/dependabot-auto-merge.test.js.
#
# Setup (one-time, repo owner): a GitHub App with repository permissions
# Contents, Pull requests and Workflows set to read & write, installed on
# this repo only. Store its Client ID and a private key (.pem) as
# **Dependabot** secrets (Settings → Secrets and variables → Dependabot),
# NOT Actions secrets. Dependabot-triggered runs can only read that store:
#   AUTOMERGE_APP_CLIENT_ID, AUTOMERGE_APP_PRIVATE_KEY
# Without them the job falls back to GITHUB_TOKEN (the old behaviour) and
# leaves a warning on the run.
#
# Security: triggered on `pull_request` (not pull_request_target) and the
# job never checks out or runs PR code, so neither token is ever exposed to
# untrusted code. GITHUB_TOKEN permissions are scoped to exactly what
# `gh pr merge --auto` needs; the App token is minted with the same scope
# plus `workflows` and expires within the hour.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Dependabot's own events only (open, rebase, recreate). Those runs read
    # the Dependabot secrets store, where the App key lives. A maintainer's
    # "Update branch" also fires pull_request, but it reads the Actions
    # store instead: it would fall back to GITHUB_TOKEN and re-enable
    # auto-merge as github-actions, undoing the fix. Auto-merge survives a
    # branch update, so skipping that run loses nothing.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    env:
      HAS_APP: ${{ secrets.AUTOMERGE_APP_CLIENT_ID != '' && secrets.AUTOMERGE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint merge token (GitHub App)
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # github-actions bumps edit .github/workflows/*; merging them needs
          # this, and GITHUB_TOKEN can never be granted it.
          permission-workflows: write

      - name: Warn that main CI will not run for this merge
        if: env.HAS_APP != 'true'
        run: >-
          echo "::warning title=Auto-merge using GITHUB_TOKEN::The
          AUTOMERGE_APP_CLIENT_ID / AUTOMERGE_APP_PRIVATE_KEY Dependabot
          secrets are missing, so this PR will merge as github-actions and
          main's CI and deploy will not run for it. See the setup notes at
          the top of dependabot-auto-merge.yml."

      - name: Enable auto-merge
        # Auto-merge unless it is a non-actions semver-major bump.
        # github-actions majors are allowed; npm majors are held for
        # manual review.
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
