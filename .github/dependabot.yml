# Dependabot config — keeps npm + GitHub Actions dependencies fresh
# without manual chasing. Free for public + private GitHub repos.
#
# Scope today:
#   - npm: the dev-dependency tree (currently @playwright/test). Used by
#     the E2E suite; updates land as PRs we can review on the existing
#     CI gates (Unit tests + Playwright E2E).
#   - github-actions: the workflows themselves (actions/checkout,
#     actions/setup-node, actions/upload-artifact, actions/cache,
#     microsoft/playwright-github-action if/when added). Updates here
#     keep the runners on current Node + cache-format versions.
#
# NOT covered:
#   - The Firebase JS SDK (loaded from gstatic with SRI hashes pinned
#     in index.html / firebase-deploy headers). Dependabot can't see
#     CDN-loaded scripts. Use scripts/update-firebase-sri.sh to bump
#     the version + recompute the integrity hashes when Firebase
#     publishes a new SDK — schedule a quarterly reminder.
#   (firebase-admin was listed here as NOT covered, because the ops
#   workflows installed it one-shot with `npm i --no-save`. That stopped
#   being true in #316, 2026-08-17: it is a root devDependency in the
#   committed lock now, so the "/" entry below already covers it, and the
#   four ops workflows install it with `npm ci`.)
#   (firebase-tools was likewise uncovered until 2026-08-17 — it now has
#   its own package + lock under tools/firebase-cli, watched below.)
#
# Schedule: weekly Mondays, 04:18 UTC. Off-:00 minute and offset from
# the daily cleanup/backup crons to avoid runner contention.
# Open-PR cap: 4 — enough breathing room without flooding.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "npm"
    # firebase-admin v14 REMOVES the namespaced accessors the four ops scripts
    # are built on — measured against 14.2.0, not inferred:
    #     admin.initializeApp  function
    #     admin.database       undefined   <- 4 call sites
    #     admin.storage        undefined   <- 1 call site (lib/gcs-archive.js)
    # so `const db = admin.database()` is a TypeError on the first line of real
    # work in backup-sessions, cleanup-stale-sessions, firebase-cost-monitor
    # and pseudonymise-export. Those run ONLY on their nightly cron, so the
    # bump would have gone green on the PR and broken at 03:00.
    # ✅ THAT MIGRATION IS DONE (2026-08-17). scripts/ and functions/ now import
    # getDatabase / getStorage from firebase-admin/database and
    # firebase-admin/storage. Those modular paths exist in v13 AND v14 and were
    # exercised against real installs of both, so the code is version-agnostic
    # across the boundary — v14 no longer breaks it.
    #
    # This ignore is kept ONLY so the major lands deliberately rather than as a
    # surprise alongside unrelated work: the bump still needs the functions
    # package.json moved in the same change. Lift it together with that bump,
    # at which point PR #320 becomes safe to take.
    # tests/firebase-admin-api-surface.test.js is the real safety net — it
    # derives the entry points the scripts import and fails if an installed
    # version stops exporting them. This ignore is convenience.
    ignore:
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # The pinned firebase-tools CLI has its OWN package.json + lock under
  # tools/firebase-cli, kept out of the root lock on purpose (670 packages
  # that only the rules-E2E job needs). Watched here so pinning it does not
  # mean freezing it — an unwatched pin just ages into a stale, unpatched
  # one. Added 2026-08-17 with the pin itself.
  - package-ecosystem: "npm"
    directory: "/tools/firebase-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "firebase-tools"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cloud Functions have their OWN package.json (nodemailer, firebase-admin,
  # sanitize-html) — watched separately so the functions tree gets auto-bumps
  # too (added 2026-05-30 after a security review flagged a stale nodemailer).
  - package-ecosystem: "npm"
    directory: "/docs/Third_session/PBL_platform/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "npm"
      - "functions"
    # ⚠ THE STATED REASON FOR THIS IGNORE EXPIRED (corrected 2026-08-17).
    # It read: "firebase-functions (7.2.5, the latest) peers firebase-admin to
    # ^11 || ^12 || ^13, so v14 is NOT installable here — a clean npm ci fails
    # ERESOLVE. Hold the major until firebase-functions adds v14 support, then
    # remove this ignore." firebase-functions is now 7.3.2 and peers
    # `^11.10.0 || ^12.0.0 || ^13.0.0 || ^14.0.0`, so that precondition is MET
    # and ERESOLVE is no longer the blocker.
    # The second half of that old note — v14 removes the namespaced accessors
    # and index.js was written against them — is ALSO resolved now: index.js
    # migrated to getDatabase (firebase-admin/database) on 2026-08-17, a path
    # v13 and v14 expose identically. Verified by loading index.js against both.
    #
    # So nothing technical blocks v14 here any more. The ignore is kept only so
    # the major lands as a deliberate change (root + functions together, both
    # lockfiles) rather than arriving piecemeal. Lift it with that bump.
    ignore:
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:18"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
