# Auto-merge for Dependabot pull requests.
#
# Dependabot opens dependency-bump PRs (npm + github-actions, see
# .github/dependabot.yml). This workflow turns on GitHub's native
# auto-merge for them so they merge themselves once the required CI gates
# pass (Unit tests + the Playwright matrix + Rules E2E) — no manual
# merge-button babysitting.
#
# Policy:
#   - github-actions bumps: auto-merge any version jump (incl. major).
#     These touch only CI tooling and are fully exercised by the matrix.
#   - npm bumps: auto-merge patch + minor only. A major (potentially
#     breaking) bump to a dependency that ships from the deploy source is
#     left for a human to review and merge by hand.
#
# main is the deploy source for canamed-69785.web.app and is protected
# (PR required, CI required, no direct push). Auto-merge respects every
# branch-protection gate: it only removes the final manual click once all
# gates are green, and it can never merge anything CI rejects.
#
# WHY A GITHUB APP TOKEN, NOT GITHUB_TOKEN (changed 2026-09-30): GitHub
# performs an auto-merge as whoever ENABLED it. Enabled with GITHUB_TOKEN,
# the merge is pushed by github-actions[bot], and GitHub never starts a
# workflow from a GITHUB_TOKEN push. So every Dependabot merge landed on
# main with no E2E, no unit tests and, because firebase-deploy.yml runs
# after main's E2E, no deploy. Nothing went red; main just went unchecked.
# A GitHub App installation token has no such restriction. Guarded by
# tests/dependabot-auto-merge.test.js.
#
# Setup (one-time, repo owner): a GitHub App with repository permissions
# Contents and Pull requests set to read & write, installed on this repo
# only. Store its Client ID and a private key (.pem) as **Dependabot**
# secrets (Settings → Secrets and variables → Dependabot), NOT Actions
# secrets. Dependabot-triggered runs can only read that store:
#   AUTOMERGE_APP_CLIENT_ID, AUTOMERGE_APP_PRIVATE_KEY
#
# Failure handling, deliberately asymmetric:
#   - Secrets NOT set (forks, or before setup): fall back to GITHUB_TOKEN,
#     i.e. the old behaviour, and leave a warning on the run.
#   - Secrets set but the token can't be minted (rotated key, wrong Client
#     ID, App uninstalled): the job fails red and arms nothing. The PR then
#     waits for a manual merge, which runs main's CI. A broken key must not
#     quietly bring back the unchecked merges this change removes.
#
# No `workflows` permission: github-actions bumps edit .github/workflows/*,
# yet #187, #214 and #352 auto-merged without it. If one ever sticks with
# a workflows-permission error, grant Workflows on the App and add
# `permission-workflows: write` below.
#
# Security: triggered on `pull_request` (not pull_request_target) and the
# job never checks out or runs PR code, so neither token is ever exposed to
# untrusted code. Both tokens are scoped to exactly what `gh pr merge
# --auto` needs; the App token expires within the hour. The token action
# holds the App key, so it is pinned to a commit (Dependabot bumps it).

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Dependabot's own events only (open, rebase, recreate, re-run). Those
    # runs read the Dependabot secrets store, where the App key lives. A
    # maintainer's "Update branch" also fires pull_request, but it reads the
    # Actions store instead: it would fall back to GITHUB_TOKEN and re-enable
    # auto-merge as github-actions, undoing the fix. Auto-merge survives a
    # branch update by anyone with write access, so skipping loses nothing.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    env:
      HAS_APP: ${{ secrets.AUTOMERGE_APP_CLIENT_ID != '' && secrets.AUTOMERGE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply merge policy
        id: policy
        # Auto-merge unless it is a non-actions semver-major bump.
        # github-actions majors are allowed; npm majors are held for
        # manual review. The expression is a plain boolean.
        run: >-
          echo "arm=${{ steps.meta.outputs.update-type != 'version-update:semver-major' ||
          steps.meta.outputs.package-ecosystem == 'github_actions' }}" >> "$GITHUB_OUTPUT"

      - name: Mint merge token (GitHub App)
        id: app
        if: steps.policy.outputs.arm == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Warn that main CI will not run for this merge
        if: steps.policy.outputs.arm == 'true' && env.HAS_APP != 'true'
        run: >-
          echo "::warning title=Auto-merge using GITHUB_TOKEN::The
          AUTOMERGE_APP_CLIENT_ID / AUTOMERGE_APP_PRIVATE_KEY Dependabot
          secrets are missing, so this PR will merge as github-actions and
          main's CI and deploy will not run for it. See the setup notes at
          the top of dependabot-auto-merge.yml."

      - name: Enable auto-merge
        if: steps.policy.outputs.arm == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
